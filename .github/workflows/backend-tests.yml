name: Backend Tests

# run on push and pull requests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # make sure backend tests pass
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check backend
        run: npm run typecheck --workspace=backend

      - name: Run backend tests
        run: npm test

      - name: Regenerate OpenAPI document
        run: npm run docs:export --workspace=backend

      - name: Verify OpenAPI document is current
        run: git diff --exit-code -- backend/openapi.json